name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # Runs on every SUPPORTED Node LTS line, not just the one `.nvmrc` pins, so a
  # break on a newer Node shows up here rather than in a consumer's install.
  # `.nvmrc` (the version used for local development and for publishing) must
  # stay one of these; the floor the package DECLARES is `engines.node` in
  # package.json, which is lower than the lines exercised here because Node 20
  # reached end-of-life on 2026-04-30 and is not worth spending CI time on.
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    name: build-and-test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc -b --noEmit
      - name: Lint
        run: npx eslint .
      - name: Test
        run: npm test
      - name: Library build
        run: npm run build:lib

  # Browser-level tests (Playwright): real CSS layout, real chunk loading, real
  # right-to-left rendering — what the jsdom suite above cannot see. A separate
  # job, so it runs in parallel and never slows the main one down.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm run test:e2e
      - name: Upload the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
